name: Public client checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - run: pnpm --dir protocol install --frozen-lockfile
      - run: pnpm --dir protocol lint
      - run: pnpm --dir protocol test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner JDK
        run: java -version
      - name: Unit, lint, unsigned debug build
        run: ./android/gradlew -p android testDebugUnitTest lintDebug assembleDebug --no-daemon

  publication-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash scripts/publication-safety.sh

  ci-public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci-public-safety.sh
      - name: Test protected release trust and candidate contracts
        run: >-
          node --test
          scripts/android-public-release-security.test.mjs
          scripts/android-release-trust-policy.test.mjs
          scripts/ios-release-trust-policy.test.mjs
          scripts/ios-release-candidate-contract.test.mjs
          scripts/ios-app-store-connect-preflight.test.mjs
      - name: Test secret-safe signed candidate diagnostics
        run: python3 scripts/ios-signed-candidate-validation.test.py
      - name: Validate official iOS AppIcon source contract
        run: python3 scripts/ios-appicon-contract.py --source .

  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify fresh toolchain state
        shell: bash
        run: |
          set -euo pipefail
          source_packages_path="$RUNNER_TEMP/task004g-packages-$GITHUB_RUN_ID"
          derived_data_path="$RUNNER_TEMP/task004g-derived-$GITHUB_RUN_ID"
          echo "SOURCE_PACKAGES_PATH=$source_packages_path" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=$derived_data_path" >> "$GITHUB_ENV"
          test ! -e "$source_packages_path"
          test ! -e "$derived_data_path"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ios/KOEON.xcodeproj -scheme KOEON -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH"
      - name: Record package resolution
        shell: bash
        run: find ios -type f -name Package.resolved -print -exec cat {} \;
      - name: Select simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if ".iOS-" in k for x in d[k] if x.get("isAvailable") and x.get("name", "").startswith("iPhone")))')"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "SIMULATOR_DESTINATION=platform=iOS Simulator,arch=arm64,id=$udid" >> "$GITHUB_ENV"
      - name: Simulator build
        run: xcodebuild -project ios/KOEON.xcodeproj -scheme KOEON -configuration Debug -destination "$SIMULATOR_DESTINATION" -derivedDataPath "$DERIVED_DATA_PATH" -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Validate compiled AppIcon
        run: python3 scripts/ios-appicon-contract.py --app "$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/KOEON.app"
      - name: XCTest
        run: xcodebuild -project ios/KOEON.xcodeproj -scheme KOEON -configuration Debug -destination "$SIMULATOR_DESTINATION" -derivedDataPath "$DERIVED_DATA_PATH" -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" -only-testing:KOEONTests ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
