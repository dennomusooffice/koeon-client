name: iOS TestFlight Internal Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a disposable signed candidate or rebuild and upload the exact source
        required: true
        default: CANDIDATE_ONLY
        type: choice
        options:
          - CANDIDATE_ONLY
          - TESTFLIGHT_UPLOAD
      client_sha:
        description: Human-approved full client commit SHA
        required: true
        type: string
      expected_tree_sha:
        description: Human-approved full Git tree SHA
        required: true
        type: string
      marketing_version:
        description: Apple marketing version, for example 1.0
        required: true
        type: string
      build_number:
        description: Unused positive App Store Connect build number
        required: true
        type: string
      what_to_test:
        description: Sanitized internal tester notes
        required: false
        default: KOEON internal physical acceptance
        type: string
      upload_confirmation:
        description: TESTFLIGHT_UPLOAD requires the exact value UPLOAD_TESTFLIGHT
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: koeon-testflight-internal
  cancel-in-progress: false

jobs:
  trust-gate:
    name: Validate immutable trusted source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_kind: ${{ steps.policy.outputs.source_kind }}
      client_sha: ${{ steps.policy.outputs.client_sha }}
      tree_sha: ${{ steps.policy.outputs.tree_sha }}
      workflow_sha: ${{ steps.policy.outputs.workflow_sha }}
      main_sha: ${{ steps.policy.outputs.main_sha }}
      pr_number: ${{ steps.policy.outputs.pr_number }}
    steps:
      - name: Check out protected release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-infrastructure
          persist-credentials: false
      - name: Test trusted source policy
        run: node --test release-infrastructure/scripts/ios-release-trust-policy.test.mjs
      - name: Validate dispatch authority, exact tree, and Public CI
        id: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLIENT_SHA: ${{ inputs.client_sha }}
          EXPECTED_TREE_SHA: ${{ inputs.expected_tree_sha }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          UPLOAD_CONFIRMATION: ${{ inputs.upload_confirmation }}
        run: node release-infrastructure/scripts/ios-release-trust-policy.mjs

  build-sign-validate:
    name: Build, sign, validate, and dispose
    needs: trust-gate
    runs-on: macos-26
    timeout-minutes: 75
    environment:
      name: testflight-internal
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_MODE: ${{ inputs.mode }}
      CLIENT_SHA: ${{ needs.trust-gate.outputs.client_sha }}
      EXPECTED_TREE_SHA: ${{ needs.trust-gate.outputs.tree_sha }}
      CLIENT_SOURCE_DIR: ${{ github.workspace }}/client-source
      INFRA_ROOT: ${{ github.workspace }}/release-infrastructure
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      KOEON_API_BASE_URL: ${{ secrets.KOEON_API_BASE_URL }}
      IOS_APP_CREDENTIAL: ${{ secrets.IOS_APP }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KOEON_BUNDLE_ID: ${{ vars.KOEON_BUNDLE_ID }}
      KOEON_ASSOCIATED_DOMAIN: ${{ vars.KOEON_ASSOCIATED_DOMAIN }}
    steps:
      - name: Check out protected release implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-gate.outputs.workflow_sha }}
          path: release-infrastructure
          persist-credentials: false
      - name: Check out exact Human-approved client source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-gate.outputs.client_sha }}
          path: client-source
          fetch-depth: 1
          persist-credentials: false
      - name: Validate protected toolchain and release inputs
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [[ -d "$DEVELOPER_DIR" ]] || { echo "Pinned stable Xcode is unavailable" >&2; exit 1; }
          [[ -n "$KOEON_API_BASE_URL" ]] || { echo "Missing Environment secret KOEON_API_BASE_URL" >&2; exit 1; }
          [[ -n "$IOS_APP_CREDENTIAL" ]] || { echo "Missing Environment secret IOS_APP" >&2; exit 1; }
          [[ -n "$APPLE_TEAM_ID" && -n "$KOEON_BUNDLE_ID" && -n "$KOEON_ASSOCIATED_DOMAIN" ]] || {
            echo "Missing required testflight-internal Environment variable" >&2
            exit 1
          }
          echo "::add-mask::$KOEON_API_BASE_URL"
          echo "IOS_CREDENTIAL_DIR=$RUNNER_TEMP/ios-app-credential" >>"$GITHUB_ENV"
          xcodebuild -version
          node --test \
            "$INFRA_ROOT/scripts/ios-release-candidate-contract.test.mjs" \
            "$INFRA_ROOT/scripts/ios-app-store-connect-preflight.test.mjs"
      - name: Materialize temporary App Store Connect credential
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 "$INFRA_ROOT/scripts/parse-ios-app-credential.py"
      - name: Verify Apple access and unused build number
        shell: bash
        run: |
          set -euo pipefail
          set +x
          node "$INFRA_ROOT/scripts/ios-app-store-connect-preflight.mjs"
      - name: Build, sign, validate, and optionally upload exact source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          set +x
          "$INFRA_ROOT/scripts/ios-public-release.sh"
      - name: Write sanitized release evidence
        if: always()
        shell: bash
        env:
          SOURCE_KIND: ${{ needs.trust-gate.outputs.source_kind }}
          SOURCE_PR: ${{ needs.trust-gate.outputs.pr_number }}
          IPA_SHA256: ${{ steps.release.outputs.ipa_sha256 }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          set -euo pipefail
          notes="$(python3 -c 'import os; print(" ".join(os.environ.get("WHAT_TO_TEST", "").split())[:500])')"
          {
            echo "## KOEON internal release evidence"
            echo "- Mode: \`$RELEASE_MODE\`"
            echo "- Source authority: \`$SOURCE_KIND\`"
            echo "- Same-repository PR: \`${SOURCE_PR:-N/A}\`"
            echo "- Exact commit: \`$CLIENT_SHA\`"
            echo "- Exact tree: \`$EXPECTED_TREE_SHA\`"
            echo "- Version/build: \`$MARKETING_VERSION ($BUILD_NUMBER)\`"
            echo "- Signed IPA SHA-256: \`${IPA_SHA256:-NOT_AVAILABLE}\`"
            echo "- Runtime endpoint value: not logged"
            echo "- Signed IPA retained as Actions artifact: NO"
            echo "- Internal-only export policy: YES"
            echo "- Tester notes: $notes"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Remove every credential, archive, IPA, and ephemeral overlay
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf "$IOS_CREDENTIAL_DIR"
          rm -rf "$CLIENT_SOURCE_DIR/ios/KOEON/Assets.xcassets"
          if [[ -z "$(git -C "$CLIENT_SOURCE_DIR" ls-files 'ios/KOEON.xcodeproj/project.xcworkspace/**')" ]]; then
            rm -rf "$CLIENT_SOURCE_DIR/ios/KOEON.xcodeproj/project.xcworkspace"
          fi
          rm -rf "$RUNNER_TEMP/KOEON-public-release.xcarchive"
          rm -rf "$RUNNER_TEMP/koeon-public-release-export"
          rm -rf "$RUNNER_TEMP/koeon-public-release-signed"
          rm -rf "$RUNNER_TEMP/koeon-public-release-packages"
          rm -rf "$RUNNER_TEMP/koeon-public-release-derived"
          rm -f "$RUNNER_TEMP/KOEON.Release.entitlements"
          rm -f "$RUNNER_TEMP/PublicReleaseExportOptions.plist"
          rm -f "$RUNNER_TEMP/public-release-settings.txt"
          rm -f "$RUNNER_TEMP/public-release-signed-entitlements.plist"
          rm -f "$RUNNER_TEMP/public-release-profile.plist"
          rm -f "$RUNNER_TEMP/public-release-preserved-entitlements.plist"
